<!DOCTYPE html>
<html>
<head>
    <title>Be My Valentine?</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        h1 {
            font-size: 3rem;
            color: #ff3366;
            margin-top: 80px;
        }

        button {
            font-size: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: absolute;
            transition: 0.2s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            left: 40%;
            top: 55%;
        }

        #noBtn {
            background-color: #999;
            color: white;
            left: 55%;
            top: 55%;
        }
    </style>
</head>
<body>

    <h1>Will you be my Valentine? ❤️</h1>

    <button id="yesBtn" onclick="sayYes()">Yes</button>
    <button id="noBtn">No</button>

    <script>
        let yesSize = 20;

        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");

        // Load celebration sound (make sure file exists in same folder)
        const celebrationSound = new Audio("celebration.mp3");

        // NO button teleports but stays fully on screen
        noBtn.addEventListener("mouseover", function() {

            const buttonWidth = noBtn.offsetWidth;
            const buttonHeight = noBtn.offsetHeight;

            const maxX = window.innerWidth - buttonWidth;
            const maxY = window.innerHeight - buttonHeight;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";

            // Grow YES button each time
            yesSize += 10;
            yesBtn.style.fontSize = yesSize + "px";
        });

        function sayYes() {

            window.location.href = "yes.html";

        }
    </script>

</body>
</html>
